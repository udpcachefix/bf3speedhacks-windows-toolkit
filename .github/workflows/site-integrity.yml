name: Site integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Verify Pages mirror and links
        run: python tests/verify_site.py
